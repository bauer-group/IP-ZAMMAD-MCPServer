# =============================================================================
# Docker Maintenance — Auto-merge Dependabot PRs
# =============================================================================
# Every Dependabot PR reaches this workflow (no `paths:` filter), so each one
# gets an explicit decision and annotation instead of silently staying open:
#
#   docker          app/bg-zammad-mcp/Dockerfile base image
#   pip             app/bg-zammad-mcp/pyproject.toml
#                   Both live under app/**, so docker-release.yml runs on the
#                   PR: the Python gate (tests.yml) and the image build with
#                   its in-image test stage. A patch update is merged once
#                   that run passed; minor and major updates stay open.
#   docker-compose  docker-compose*.yml image tags. docker-release.yml runs
#                   on them but only validates the files - nothing starts the
#                   stack, so these are not tested. The tags are floating
#                   (redis 8-alpine, own image latest): Dependabot can only
#                   propose a major, which stays open. Keep them floating.
#   github-actions  Never merged automatically - a CI change (module guard).
#
# A merged update triggers no release by itself: the merge is made with the
# GITHUB_TOKEN, so docker-release.yml runs with the next push to main or when
# it is started by hand.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # runs the tests and builds the image.
      required-workflows: '.github/workflows/docker-release.yml'
    secrets: inherit
