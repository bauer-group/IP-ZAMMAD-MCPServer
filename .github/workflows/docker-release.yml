name: 🚀 Release & Docker Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
  workflow_dispatch:
    inputs:
      force-release:
        description: 'force create release'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  security-events: write
  # Required by docker-build.yml@main: a declared permissions: block sets every
  # unlisted scope to none, and the reusable workflow now needs these three.
  attestations: write   # write the build-provenance attestation
  id-token: write       # OIDC token to sign the attestation (keyless/Sigstore)
  actions: read         # its nested security-analysis job reads run metadata

jobs:
  # ============================================
  # Validation Jobs
  # ============================================

  validate-compose:
    name: 🔍 Validate Docker Compose
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-compose.yml@main
    with:
      compose-files: '["docker-compose.coolify.yml", "docker-compose.traefik.yml", "docker-compose.development.yml"]'
      env-file: '.env.example'
      validate-services: '["zammad-mcp", "redis"]'

  # The Python gate: ruff + mypy --strict + pytest with coverage enforced.
  # Listed in the release job's `needs` below, so no tag, GitHub Release or
  # CHANGELOG entry can be cut while the suite is red.
  quality:
    name: 🧪 Tests
    uses: ./.github/workflows/tests.yml

  # ============================================
  # Release Job (only on main branch push)
  # ============================================

  release:
    name: 📦 Create Semantic Release
    needs: [validate-compose, quality]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.validate-compose.result == 'success' &&
      needs.quality.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: 'main'
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
      extra-plugins: '@semantic-release/exec'
    secrets: inherit

  # ============================================
  # Docker Build & Push (bg-zammad-mcp image)
  # ============================================

  docker-build-bg-zammad-mcp-release:
    name: 🐳 Build & Push bg-zammad-mcp
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/IP-ZAMMAD-MCPServer/bg-zammad-mcp'
      docker-image-name: 'bauergroup/bg-zammad-mcp'

      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'

      # semantic-release already stamps the Dockerfile version and commits it
      # (see .github/config/release/semantic-release.json — prepareCmd + git
      # assets), so the reusable workflow must NOT also try to. When both do,
      # its "Commit Dockerfile Version Update" step rewrites the file, then
      # fails to pull the release commit on top of its own unstaged change:
      #   error: Your local changes ... would be overwritten by merge
      # and the job exits 128 AFTER a perfectly good image has been pushed.
      update-dockerfile-version: false
      auto-tags: true
      latest-tag: true

      dockerfile-path: './app/bg-zammad-mcp/Dockerfile'
      docker-context: './app/bg-zammad-mcp'
      # amd64 only. 'linux/amd64,linux/arm64' here built amd64 alone and
      # published a single-platform manifest — the template drops the second
      # platform (same in IP-n8n-MCPServer and IP-Shlink-MCPServer).
      platforms: 'linux/amd64'

      push: true

      # Trivy runs BEFORE the push and gates it (v1.0.0 run: scan 14:38:06,
      # push 14:38:18), and the template treats a scan that could not run as a
      # finding — so this genuinely blocks a CRITICAL image from reaching GHCR.
      security-scan: true
      security-fail-on: 'CRITICAL'
      generate-sbom: true
      sync-dockerhub-readme: true
    secrets: inherit

  docker-build-bg-zammad-mcp-pr:
    name: 🔨 Validate bg-zammad-mcp Build (PR)
    needs: [validate-compose, quality]
    if: |
      github.event_name == 'pull_request' &&
      needs.validate-compose.result == 'success' &&
      needs.quality.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/IP-ZAMMAD-MCPServer/bg-zammad-mcp'

      auto-tags: true
      dockerfile-path: './app/bg-zammad-mcp/Dockerfile'
      docker-context: './app/bg-zammad-mcp'
      # Matches the release job — amd64 only.
      platforms: 'linux/amd64'

      push: false

      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit
