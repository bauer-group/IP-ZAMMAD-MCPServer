# =============================================================================
# Dependabot Configuration
# =============================================================================
# Watches:
#   1. GitHub Actions versions (workflows pinned to @main pull module updates)
#   2. Image references inside docker-compose*.yml files
#   3. bg-zammad-mcp base image (python:3.14-alpine)
#   4. bg-zammad-mcp Python deps (pyproject.toml)
#
# COMMIT PREFIXES DECIDE WHETHER AN UPDATE SHIPS
#   docker-release.yml only builds and pushes the image when semantic-release
#   actually cuts a release (`if: needs.release.outputs.release-created`). A
#   `chore(...)` update therefore lands on main but never reaches a published
#   image — it rides along with whatever releasing commit happens to come next,
#   which for a runtime dependency can be weeks.
#
#   So the two ecosystems that change what runs INSIDE the image use `fix(...)`
#   and cut their own patch: the base image (3) and the Python deps (4). The
#   two that do not are deliberately left on `chore(...)`: GitHub Actions (1)
#   never enters the build context, and the compose files (2) describe how the
#   image is deployed, not what it contains.
# =============================================================================

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"

  # Docker Compose images
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "chore(deps)"

  # bg-zammad-mcp base image (python:3.14-alpine in app/bg-zammad-mcp/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/app/bg-zammad-mcp"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      # fix(...) so a base-image CVE patch cuts a release and rebuilds the
      # image itself, rather than waiting for an unrelated commit.
      prefix: "fix(docker)"

  # bg-zammad-mcp Python deps (declared in pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/app/bg-zammad-mcp"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "python"
      - "dependabot"
    commit-message:
      # fix(...) — these packages are installed into the image, so an update
      # that never triggers a build is an update that never ships.
      prefix: "fix(deps)"
